[project]
name = "squadforce"
version = "0.1.0"
description = "SquadForce — simulador de futebol (Game Design v5.2). Backend FastAPI + SQLite."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.164.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "openpyxl==3.1.5",
    "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "shared/python"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: usa a planilha real Dados/jogadores.xlsx somente para leitura (pulado se ausente)",
    "e2e: inicia o servidor uvicorn real em processo separado",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
